# Builds the site and publishes it to GitHub Pages whenever changes reach the main branch.
# Settings > Pages > Source must be set to "GitHub Actions" (one-time, see docs/DEPLOYMENT.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v5.0.0

      - name: Check JavaScript syntax
        run: |
          find src scripts -name '*.js' -o -name '*.mjs' | while read -r f; do node --check "$f"; done

      - name: Build the site
        run: node scripts/build.mjs
        env:
          CI: "true"
          # Fails with a plain-English message if the Firebase settings haven't been added yet.
          REQUIRE_FIREBASE_CONFIG: "true"
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}
          ENABLE_GOOGLE_SIGNIN: ${{ vars.ENABLE_GOOGLE_SIGNIN }}
          IDLE_TIMEOUT_MINUTES: ${{ vars.IDLE_TIMEOUT_MINUTES }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Check the built site (links, accessibility basics, no private files)
        run: node scripts/check.mjs

      - name: Package the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
